# Each demo-* service is one process running the real connector against its own
# fake instance. The mock server proxy needs port 5433, so they can't share a
# container.
x-demo: &demo
  build:
    context: ../..
    dockerfile: dashboards/prometheus-grafana/demo/Dockerfile

services:
  demo-orders-primary:
    <<: *demo
    environment:
      DEMO_CLUSTER: orders
      DEMO_INSTANCE: primary
      DEMO_IAM: "true"
      DEMO_FAIL_PCT: "4"
    ports: ["127.0.0.1:2223:2223"]
  demo-orders-read-pool:
    <<: *demo
    environment:
      DEMO_CLUSTER: orders
      DEMO_INSTANCE: read-pool
      DEMO_FAIL_PCT: "8"
  demo-analytics-primary:
    <<: *demo
    environment:
      DEMO_LOCATION: europe-west1
      DEMO_CLUSTER: analytics
      DEMO_INSTANCE: primary
      DEMO_IAM: "true"
      DEMO_FAIL_PCT: "15"
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Local demo only: anyone who can reach this port is a Grafana admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
  setup:
    image: nginx:1.29-alpine
    volumes:
      - ./setup/index.html:/usr/share/nginx/html/index.html:ro
      - ./setup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8080:80"]
    depends_on: [grafana]
